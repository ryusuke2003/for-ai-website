[package]
name = "one-desktop"
version = "0.1.6"
description = "ONE focus timer desktop application"
authors = ["ryusuke2003"]
edition = "2021"

[lib]
name = "one_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.11.0"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
