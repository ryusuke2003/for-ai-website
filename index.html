<!doctype html>
<html lang="ja" data-react-timer-state="1" data-react-timer-controls="1" data-react-timer-settings="1" data-react-progress-overview="1" data-react-progress-details="1" data-react-backup-panel="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="集中時間を決めて、完了した集中を記録・可視化するための小さなWebアプリ。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ONE — 集中タイマー</title>
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="timer-progress.css">
  <script src="timer-bootstrap.js" defer></script>
  <script src="app.js" defer></script>
  <script src="legacy/interop/timer.js" defer></script>
  <script src="completion-sound.js" defer></script>
  <script src="wake-lock.js" defer></script>
  <script src="stats.js" defer></script>
  <script src="daily-goal-progress.js" defer></script>
  <script src="tab-guard.js" defer></script>
  <script src="backup.js" defer></script>
  <script src="custom-timer.js" defer></script>
  <script src="legacy/interop/settings-progress.js" defer></script>
  <script src="shortcuts.js" defer></script>
  <script src="privacy-reset.js" defer></script>
  <script src="legacy/interop/progress-backup.js" defer></script>
  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
  <div id="root">
    <!--
      Temporary hidden runtime scaffold for the remaining classic scripts.
      React replaces this subtree on mount; it is not a user-facing fallback UI.
    -->
    <div id="legacy-runtime-scaffold" hidden aria-hidden="true">
      <div class="timer-card">
        <div id="timer" role="timer" aria-label="残り時間">25:00</div>
        <progress id="timer-progress" max="1500" value="0" aria-label="集中時間の進捗"></progress>
        <p id="timer-status" role="status" aria-live="polite">準備できたらスタート。</p>
        <p id="timer-end-time" hidden><time id="timer-end-at"></time></p>
        <button id="start-button" type="button">スタート</button>
        <button id="reset-button" type="button">リセット</button>
        <button id="focus-mode-button" type="button" aria-pressed="false">集中表示</button>

        <button type="button" data-minutes="10">10分</button>
        <button type="button" data-minutes="25" class="active" aria-pressed="true">25分</button>
        <button type="button" data-minutes="50">50分</button>
        <input id="custom-minutes" type="number" min="1" max="180" step="1" value="25" aria-describedby="custom-minutes-status">
        <button id="custom-minutes-apply" type="button" aria-describedby="custom-minutes-status">設定</button>
        <p id="custom-minutes-status" role="status" aria-live="polite">1〜180分の整数でも設定できます。</p>
        <button id="custom-preset" type="button" data-minutes="25" hidden tabindex="-1" aria-hidden="true"></button>

        <button id="completion-sound-toggle" type="button" aria-pressed="false" aria-describedby="completion-sound-status">完了音 OFF</button>
        <p id="completion-sound-status" role="status" aria-live="polite">完了音はオフです。オンにすると短い試聴音が鳴ります。</p>
        <button id="completion-notification-toggle" type="button" aria-pressed="false" aria-describedby="completion-notification-status">完了通知 OFF</button>
        <p id="completion-notification-status" role="status" aria-live="polite">完了通知はオフです。オンにするとブラウザの通知許可を確認します。</p>
        <button id="wake-lock-toggle" type="button" aria-pressed="false" aria-describedby="wake-lock-status">画面維持 OFF</button>
        <p id="wake-lock-status" role="status" aria-live="polite">画面維持はオフです。オンにすると集中中だけ画面のスリープを抑えます。</p>
      </div>

      <button id="done-button" type="button" aria-describedby="done-hint" disabled>タイマー完了後に記録できます</button>
      <button id="discard-button" type="button" aria-describedby="done-hint" hidden>記録せず破棄する</button>
      <p id="done-hint"></p>
      <strong id="today-count">0</strong>
      <strong id="week-count">0</strong>
      <strong id="streak-count" aria-label="0日">0</strong>
      <strong id="done-count">0</strong>
      <p id="streak-status">今日1回から連続記録を始められます。</p>

      <input id="daily-goal-input" type="number" min="1" max="12" step="1" placeholder="3" aria-describedby="daily-goal-status">
      <button id="daily-goal-apply" type="button" aria-describedby="daily-goal-status">設定</button>
      <button id="daily-goal-clear" type="button" aria-describedby="daily-goal-status" hidden>目標を解除</button>
      <p id="daily-goal-status" role="status" aria-live="polite">今日の目標は未設定です。1〜12回で設定できます。</p>
      <div id="history-grid" role="list"></div>
      <div id="activity-grid" role="list" aria-describedby="activity-summary"></div>
      <p id="activity-summary">直近30日: 0回 · 0日活動</p>

      <button id="backup-export-button" type="button" aria-describedby="backup-hint">JSONを書き出す</button>
      <button id="backup-import-button" type="button" aria-describedby="backup-hint">JSONから復元</button>
      <button id="backup-undo-button" type="button" aria-describedby="backup-hint" hidden>直前の復元を取り消す</button>
      <input id="backup-file-input" type="file" accept="application/json,.json" hidden>
      <p id="backup-hint"></p>
      <p id="backup-status" role="status" aria-live="polite"></p>

      <p id="data-reset-hint"></p>
      <button id="data-reset-button" type="button" aria-describedby="data-reset-hint data-reset-status">この端末のデータを削除</button>
      <div id="data-reset-confirm" hidden>
        <button id="data-reset-confirm-button" type="button" aria-describedby="data-reset-hint data-reset-status">本当にすべて削除</button>
        <button id="data-reset-cancel-button" type="button">キャンセル</button>
      </div>
      <p id="data-reset-status" role="status" aria-live="polite"></p>
      <p id="focus-mode-status" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
