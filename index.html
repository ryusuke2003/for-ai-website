<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="今日やる一つだけを決めて、25分だけ集中するための小さなWebアプリ。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>ONE — 今日やる一つだけ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">ONE THING / ONE SPRINT</p>
      <h1>今日やる一つだけ。</h1>
      <p class="lead">やることを一つ決めて、25分だけ始める。残りは、あとでいい。</p>
    </header>

    <section class="card" aria-labelledby="task-title">
      <div class="section-heading">
        <span class="step">01</span>
        <h2 id="task-title">いま一番進めたいこと</h2>
      </div>
      <label class="sr-only" for="task-input">今日やる一つ</label>
      <input id="task-input" maxlength="120" autocomplete="off" placeholder="例：レポートの導入を300字書く">
      <p class="hint">この内容はこのブラウザだけに保存されます。サーバー送信はしません。</p>
    </section>

    <section class="card timer-card" aria-labelledby="timer-title">
      <div class="section-heading">
        <span class="step">02</span>
        <h2 id="timer-title">25分だけ集中する</h2>
      </div>
      <div class="timer" id="timer" aria-live="polite">25:00</div>
      <div class="controls">
        <button class="primary" id="start-button" type="button">スタート</button>
        <button class="secondary" id="reset-button" type="button">リセット</button>
      </div>
      <div class="presets" aria-label="タイマー時間">
        <button type="button" data-minutes="10">10分</button>
        <button type="button" data-minutes="25" class="active" aria-pressed="true">25分</button>
        <button type="button" data-minutes="50">50分</button>
      </div>
    </section>

    <section class="card" aria-labelledby="done-title">
      <div class="section-heading">
        <span class="step">03</span>
        <h2 id="done-title">終わったら記録する</h2>
      </div>
      <button class="done-button" id="done-button" type="button">今日はここまで進んだ ✓</button>
      <div class="streak" aria-live="polite">
        <strong id="done-count">0</strong>
        <span>回の集中を、この端末で積み上げました。</span>
      </div>
    </section>

    <footer>
      <p>データ収集なし · アカウントなし · 外部通信なし</p>
    </footer>
  </main>
</body>
</html>
