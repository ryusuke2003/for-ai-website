<!doctype html>
<html lang="ja" data-react-timer-state="1" data-react-timer-controls="1" data-react-progress-overview="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="集中時間を決めて、完了した集中を記録・可視化するための小さなWebアプリ。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ONE — 集中タイマー</title>
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="timer-progress.css">
  <script src="timer-bootstrap.js" defer></script>
  <script src="app.js" defer></script>
  <script src="legacy/interop/timer.js" defer></script>
  <script src="tab-guard.js" defer></script>
  <script src="legacy/interop/settings-progress.js" defer></script>
  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
  <div id="root">
    <!--
      Temporary hidden runtime scaffold for the remaining classic scripts.
      React replaces this subtree on mount; it is not a user-facing fallback UI.
    -->
    <div id="legacy-runtime-scaffold" hidden aria-hidden="true">
      <div class="timer-card">
        <div id="timer" role="timer" aria-label="残り時間">25:00</div>
        <p id="timer-status" role="status" aria-live="polite">準備できたらスタート。</p>
        <button id="start-button" type="button">スタート</button>
        <button id="reset-button" type="button">リセット</button>
        <button id="focus-mode-button" type="button" aria-pressed="false">集中表示</button>

        <button type="button" data-minutes="10">10分</button>
        <button type="button" data-minutes="25" class="active" aria-pressed="true">25分</button>
        <button type="button" data-minutes="50">50分</button>
        <button id="custom-preset" type="button" data-minutes="25" hidden tabindex="-1" aria-hidden="true"></button>
      </div>

      <button id="done-button" type="button" aria-describedby="done-hint" disabled>タイマー完了後に記録できます</button>
      <button id="discard-button" type="button" aria-describedby="done-hint" hidden>記録せず破棄する</button>
      <p id="done-hint"></p>
      <strong id="done-count">0</strong>

      <p id="focus-mode-status" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
