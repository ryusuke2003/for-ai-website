name: Frontend build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Build with Vite
        run: npm run build
      - name: Verify production entrypoints
        shell: bash
        run: |
          test -f dist/legacy/interop/timer.js
          test -f dist/legacy/interop/settings-progress.js
          grep -q 'legacy/interop/timer.js' dist/index.html
          grep -q 'legacy/interop/settings-progress.js' dist/index.html
          for old in \
            react-timer-state-source.js \
            react-secondary-state-source.js \
            react-remaining-state-source.js \
            react-timer-controls-bridge.js \
            react-timer-settings-bridge.js \
            react-progress-overview-bridge.js \
            react-progress-details-bridge.js \
            react-backup-panel-bridge.js \
            custom-timer.js \
            daily-goal-progress.js \
            stats.js \
            privacy-reset.js \
            backup.js \
            legacy/interop/progress-backup.js; do
            if test -e "dist/$old"; then exit 1; fi
            if grep -q "$old" dist/index.html; then exit 1; fi
          done
          if test -e dist/backup-timer-context-compat.js; then exit 1; fi
          if grep -q 'backup-timer-context-compat.js' dist/index.html; then exit 1; fi
          if grep -q 'react-timer-display-bridge.js' dist/index.html; then exit 1; fi
          if grep -q 'src/main.jsx' dist/index.html; then exit 1; fi
          grep -Eq 'assets/index-[^" ]+\.js' dist/index.html
