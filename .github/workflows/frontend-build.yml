name: Frontend build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Build with Vite
        run: npm run build
      - name: Verify production entrypoints
        shell: bash
        run: |
          test -f dist/react-timer-state-source.js
          test -f dist/react-secondary-state-source.js
          test -f dist/react-remaining-state-source.js
          test -f dist/react-timer-controls-bridge.js
          test -f dist/react-timer-settings-bridge.js
          test -f dist/react-progress-overview-bridge.js
          test -f dist/react-progress-details-bridge.js
          test -f dist/react-backup-panel-bridge.js
          grep -q 'react-timer-state-source.js' dist/index.html
          grep -q 'react-secondary-state-source.js' dist/index.html
          grep -q 'react-remaining-state-source.js' dist/index.html
          grep -q 'react-timer-controls-bridge.js' dist/index.html
          grep -q 'react-timer-settings-bridge.js' dist/index.html
          grep -q 'react-progress-overview-bridge.js' dist/index.html
          grep -q 'react-progress-details-bridge.js' dist/index.html
          grep -q 'react-backup-panel-bridge.js' dist/index.html
          if test -e dist/backup-timer-context-compat.js; then exit 1; fi
          if grep -q 'backup-timer-context-compat.js' dist/index.html; then exit 1; fi
          if grep -q 'react-timer-display-bridge.js' dist/index.html; then exit 1; fi
          if grep -q 'src/main.jsx' dist/index.html; then exit 1; fi
          grep -Eq 'assets/index-[^" ]+\.js' dist/index.html
