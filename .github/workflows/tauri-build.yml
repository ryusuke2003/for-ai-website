name: Tauri build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify Cargo.lock is synchronized
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Build Tauri app bundle for macOS with locked dependencies
        run: npm run tauri -- build --bundles app --no-sign -- --locked

      - name: Archive macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle was not generated" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ONE-macos.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ONE-macos-app
          path: ONE-macos.zip
          if-no-files-found: error
          retention-days: 7
