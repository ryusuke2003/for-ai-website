name: Tauri build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(config.version)")"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag version ($tag_version) does not match Tauri app version ($app_version)." >&2
            exit 1
          fi

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Test version patch command with Cargo
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version_test_dir="$(mktemp -d)"
          trap 'rm -rf "$version_test_dir"' EXIT
          mkdir -p "$version_test_dir/scripts" "$version_test_dir/src-tauri"
          cp package.json "$version_test_dir/package.json"
          cp scripts/version-app.mjs "$version_test_dir/scripts/version-app.mjs"
          cp src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/build.rs "$version_test_dir/src-tauri/"
          cp -R src-tauri/src "$version_test_dir/src-tauri/src"
          (
            cd "$version_test_dir"
            npm run version:patch
            cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
          )

      - name: Install frontend dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify Cargo.lock is synchronized
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Build Tauri app bundle for macOS with locked dependencies
        run: npm run tauri -- build --bundles app --no-sign -- --locked

      - name: Archive macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle was not generated" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" timer-macos.zip

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-macos-app
          path: timer-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS app artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: timer-macos-app

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" timer-macos.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" timer-macos.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "タイマー $GITHUB_REF_NAME" \
              --generate-notes
          fi
