name: Tauri build

on:
  push:
    branches: [ci/tauri-locked-dependencies]

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Generate synchronized package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and push temporary tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "package-lockを同期してnpm ciを有効化"
          tag_name="generated-package-lock-${GITHUB_RUN_ID}"
          git tag "$tag_name"
          git push origin "refs/tags/$tag_name"
          echo "GENERATED_TAG=$tag_name"
