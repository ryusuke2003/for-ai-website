name: Tauri build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(config.version)")"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Tag version ($tag_version) does not match Tauri app version ($app_version)." >&2
            exit 1
          fi

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Test version patch command with Cargo
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version_test_dir="$(mktemp -d)"
          trap 'rm -rf "$version_test_dir"' EXIT
          mkdir -p "$version_test_dir/scripts" "$version_test_dir/src-tauri"
          cp package.json "$version_test_dir/package.json"
          cp scripts/version-app.mjs "$version_test_dir/scripts/version-app.mjs"
          cp src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/build.rs "$version_test_dir/src-tauri/"
          cp -R src-tauri/src "$version_test_dir/src-tauri/src"
          (
            cd "$version_test_dir"
            npm run version:patch
            cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
          )

      - name: Install frontend dependencies from lockfile
        if: github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund

      - name: Verify Cargo.lock is synchronized
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null

      - name: Check Tauri Rust code on pull requests
        if: github.event_name == 'pull_request'
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri app bundle for macOS with locked dependencies
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri -- build --bundles app --no-sign -- --locked

      - name: Build release with updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for updater releases." >&2
            exit 1
          fi
          npm run tauri -- build --bundles app --no-sign \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' \
            -- --locked

      - name: Archive macOS app bundle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS .app bundle was not generated" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" timer-macos.zip

      - name: Prepare updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          updater_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          if [ -z "$updater_path" ] || [ ! -f "$updater_path.sig" ]; then
            echo "Updater bundle or signature was not generated" >&2
            exit 1
          fi

          cp "$updater_path" timer-macos-updater.tar.gz
          cp "$updater_path.sig" timer-macos-updater.tar.gz.sig

          case "$(uname -m)" in
            arm64) platform="darwin-aarch64" ;;
            x86_64) platform="darwin-x86_64" ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$platform" > updater-platform.txt

      - name: Upload macOS app artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-macos-app
          path: timer-macos.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload updater artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timer-macos-updater
          path: |
            timer-macos-updater.tar.gz
            timer-macos-updater.tar.gz.sig
            updater-platform.txt
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS app artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: timer-macos-app

      - name: Download updater artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: timer-macos-updater

      - name: Create updater manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          repository = os.environ["GITHUB_REPOSITORY"]
          platform = Path("updater-platform.txt").read_text(encoding="utf-8").strip()
          signature = Path("timer-macos-updater.tar.gz.sig").read_text(encoding="utf-8").strip()
          url = f"https://github.com/{repository}/releases/download/{tag}/timer-macos-updater.tar.gz"
          manifest = {
              "version": version,
              "platforms": {
                  platform: {
                      "url": url,
                      "signature": signature,
                  }
              },
          }
          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            timer-macos.zip
            timer-macos-updater.tar.gz
            timer-macos-updater.tar.gz.sig
            latest.json
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "タイマー $GITHUB_REF_NAME" \
              --generate-notes
          fi
