name: Generate README preview

on:
  push:
    branches: [docs/readme-preview]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/readme-preview-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/readme-preview-vite.log
          exit 1

      - name: Capture app preview
        run: |
          mkdir -p docs/assets
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1000" \
            http://127.0.0.1:5173/ \
            docs/assets/app-preview.png

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-preview
          path: docs/assets/app-preview.png
          if-no-files-found: error
          retention-days: 1
