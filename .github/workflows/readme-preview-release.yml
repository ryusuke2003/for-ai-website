name: Publish README preview asset

on:
  push:
    branches: [fix/readme-preview-binary]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/readme-preview-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/readme-preview-vite.log
          exit 1

      - name: Capture preview
        run: |
          npx --yes playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1000" \
            http://127.0.0.1:5173/ \
            /tmp/app-preview.png

      - name: Publish preview to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.5 /tmp/app-preview.png --clobber
