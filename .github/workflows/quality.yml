name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check public/theme-bootstrap.js
          node --check src/features/timer/timerStateGuard.js
          node --check src/features/timer/tabGuard.js

      - name: Check static security and accessibility invariants
        run: python3 scripts/static_checks.py

      - name: Check Tailwind migration boundaries
        run: python3 scripts/tailwind_migration_checks.py

      - name: Check browser security policy
        run: python3 scripts/browser_policy_checks.py

      - name: Check focus visibility
        run: python3 scripts/focus_visibility_checks.py

      - name: Check current date semantics
        run: python3 scripts/current_date_semantics_checks.py

      - name: Check timer architecture boundaries
        run: python3 scripts/timer_state_checks.py

      - name: Reject common secret material
        run: python3 scripts/secret_checks.py
