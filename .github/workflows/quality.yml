name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check theme-bootstrap.js
          node --check timer-bootstrap.js
          node --check app.js
          node --check storage-status.js
          node --check completion-sound.js
          node --check theme.js
          node --check stats.js
          node --check tab-guard.js
          node --check backup.js
          node --check custom-timer.js
          node --check shortcuts.js
          node --check privacy-reset.js
          node --check scripts/timer_state_behavior_checks.js

      - name: Check static security and accessibility invariants
        run: python3 scripts/static_checks.py

      - name: Check browser security policy
        run: python3 scripts/browser_policy_checks.py

      - name: Check timer state integration
        run: python3 scripts/timer_state_checks.py

      - name: Check timer state behavior
        run: node scripts/timer_state_behavior_checks.js

      - name: Check backup recovery preservation
        run: python3 scripts/backup_recovery_checks.py

      - name: Check progress storage behavior
        run: python3 scripts/progress_storage_checks.py

      - name: Reject common secret material
        shell: bash
        run: |
          if grep -RIE --exclude-dir=.git --exclude=quality.yml \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})' .; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
