name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check theme-bootstrap.js
          node --check timer-bootstrap.js
          node --check app.js
          node --check storage-status.js
          node --check completion-sound.js
          node --check wake-lock.js
          node --check theme.js
          node --check stats.js
          node --check tab-guard.js
          node --check backup.js
          node --check custom-timer.js
          node --check shortcuts.js
          node --check privacy-reset.js
          node --check scripts/timer_state_behavior_checks.js

      - name: Check static security and accessibility invariants
        run: python3 scripts/static_checks.py

      - name: Check browser security policy
        run: python3 scripts/browser_policy_checks.py

      - name: Check focus visibility
        run: python3 scripts/focus_visibility_checks.py

      - name: Check current date semantics
        run: python3 scripts/current_date_semantics_checks.py

      - name: Check daily focus goal
        run: python3 scripts/daily_goal_checks.py

      - name: Check cross-tab progress sync
        run: python3 scripts/progress_cross_tab_sync_checks.py

      - name: Check focus mode storage behavior
        run: python3 scripts/focus_mode_storage_checks.py

      - name: Check timer state integration
        run: python3 scripts/timer_state_checks.py

      - name: Check timer state behavior
        run: node scripts/timer_state_behavior_checks.js

      - name: Check document title behavior
        run: python3 scripts/document_title_checks.py

      - name: Check wake lock behavior
        run: python3 scripts/wake_lock_checks.py

      - name: Check backup recovery preservation
        run: python3 scripts/backup_recovery_checks.py

      - name: Check backup export fallback
        run: python3 scripts/backup_export_fallback_checks.py

      - name: Check backup restore control availability
        run: python3 scripts/backup_control_availability_checks.py

      - name: Check progress storage behavior
        run: python3 scripts/progress_storage_checks.py

      - name: Check completion persistence order
        run: python3 scripts/completion_persistence_checks.py

      - name: Check task storage failure behavior
        run: python3 scripts/task_storage_checks.py

      - name: Check runtime storage fallback
        run: python3 scripts/runtime_storage_fallback_checks.py

      - name: Check tab session ID generation
        run: python3 scripts/tab_session_id_checks.py

      - name: Check idle timer cross-tab sync
        run: python3 scripts/idle_timer_sync_checks.py

      - name: Check theme storage behavior
        run: python3 scripts/theme_storage_checks.py

      - name: Check completion sound storage behavior
        run: python3 scripts/completion_sound_storage_checks.py

      - name: Check completion notification behavior
        run: python3 scripts/completion_notification_checks.py

      - name: Check privacy reset storage behavior
        run: python3 scripts/privacy_reset_storage_checks.py

      - name: Reject common secret material
        shell: bash
        run: |
          if grep -RIE --exclude-dir=.git --exclude=quality.yml \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})' .; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
