name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check HTML parses
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          parser.close()
          PY

      - name: Reject common secret material
        shell: bash
        run: |
          if grep -RIE --exclude-dir=.git --exclude=quality.yml \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,})' .; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
