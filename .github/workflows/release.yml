name: Release

run-name: Release ${{ inputs.bump }} from main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: manual-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Run this workflow from the main branch." >&2
          exit 1

      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm

      - name: Determine next release version and create tag
        id: release
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          source_version="$(node -e "const fs=require('fs'); const config=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); process.stdout.write(config.version)")"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          latest_version="${latest_tag#v}"

          base_version="$(node --input-type=module - "$source_version" "$latest_version" <<'NODE'
          const [sourceVersion, latestVersion] = process.argv.slice(2);
          const parse = (value) => value.split('.').map(Number);
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          };
          const candidates = [sourceVersion, latestVersion].filter(Boolean);
          process.stdout.write(candidates.reduce((best, value) => compare(value, best) > 0 ? value : best));
          NODE
          )"

          version="$(node --input-type=module - "$VERSION_BUMP" "$base_version" <<'NODE'
          import { incrementVersion } from './scripts/version-app.mjs';
          const [releaseType, baseVersion] = process.argv.slice(2);
          process.stdout.write(incrementVersion(baseVersion, releaseType));
          NODE
          )"
          release_tag="v$version"

          if git rev-parse -q --verify "refs/tags/$release_tag" > /dev/null; then
            echo "Tag $release_tag already exists. Refusing to overwrite an existing release tag." >&2
            exit 1
          fi

          release_ref="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" -m "$release_tag" "$release_ref"

          # mainはRulesetでPR必須かつ更新制限されているため変更しない。
          # tagだけをpushし、実際のapp versionはrelease buildのworkspaceでmaterializeする。
          git push origin "refs/tags/$release_tag"

          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Show release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          {
            echo "## $RELEASE_TAG"
            echo
            echo "The release tag was created from the current main commit."
            echo "The release build materializes the selected version without pushing to protected main."
            echo "The macOS build, updater signing, and GitHub Release are handled by the next job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/tauri-build.yml
    with:
      release_ref: ${{ needs.prepare.outputs.release_ref }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets: inherit
