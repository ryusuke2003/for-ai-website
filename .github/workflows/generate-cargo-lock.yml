name: Generate Cargo.lock

on:
  push:
    branches: [chore/add-cargo-lock]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Create commit object with Cargo.lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          content = base64.b64encode(Path('src-tauri/Cargo.lock').read_bytes()).decode()
          Path('/tmp/blob.json').write_text(json.dumps({'content': content, 'encoding': 'base64'}))
          PY
          blob_sha="$(curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/git/blobs" -d @/tmp/blob.json \
            | jq -r '.sha')"
          base_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          tree_sha="$(jq -n --arg base_tree "$base_tree" --arg blob_sha "$blob_sha" \
              '{base_tree:$base_tree,tree:[{path:"src-tauri/Cargo.lock",mode:"100644",type:"blob",sha:$blob_sha}]}' \
            | curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/git/trees" -d @- \
            | jq -r '.sha')"
          commit_sha="$(jq -n --arg message 'Cargo.lockを追加してRust依存を固定' --arg tree "$tree_sha" --arg parent "$GITHUB_SHA" \
              '{message:$message,tree:$tree,parents:[$parent]}' \
            | curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/git/commits" -d @- \
            | jq -r '.sha')"
          echo "GENERATED_COMMIT_SHA=${commit_sha}"
