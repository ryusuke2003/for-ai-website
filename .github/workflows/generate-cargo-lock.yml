name: Generate Cargo.lock

on:
  push:
    branches: [chore/add-cargo-lock]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit Cargo.lock
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock && git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "Cargo.lockを追加してRust依存を固定"
          git push
